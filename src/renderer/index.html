<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self' blob:; connect-src 'self' data: blob:"
    />
    <title>Inkwell</title>
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body>
    <div class="shell">
      <header class="appbar">
        <button class="icon-btn" id="btn-sidebar" title="Pages  ·  Ctrl+B" aria-label="Toggle pages sidebar"></button>
        <button class="icon-btn" id="btn-open" title="Open PDF  ·  Ctrl+O" aria-label="Open PDF"></button>

        <div class="page-jump" title="Current page — type a number to jump">
          <input
            id="page-input"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            spellcheck="false"
            aria-label="Current page number"
            value="–"
          />
          <span class="of">/</span>
          <span id="page-count">–</span>
        </div>

        <div class="appbar-spacer"></div>

        <button class="icon-btn" id="btn-undo" title="Undo  ·  Ctrl+Z" aria-label="Undo" disabled></button>
        <button class="icon-btn" id="btn-redo" title="Redo  ·  Ctrl+Shift+Z" aria-label="Redo" disabled></button>
        <button class="icon-btn" id="btn-zoom-out" title="Zoom out  ·  Ctrl+−" aria-label="Zoom out"></button>
        <button class="zoom-readout" id="zoom-readout" title="Zoom level — click for presets">100%</button>
        <button class="icon-btn" id="btn-zoom-in" title="Zoom in  ·  Ctrl++" aria-label="Zoom in"></button>
        <button class="icon-btn" id="btn-fit-width" title="Fit width  ·  Ctrl+1" aria-label="Fit width"></button>
        <button class="icon-btn" id="btn-export" title="Export annotated PDF  ·  Ctrl+E" aria-label="Export annotated PDF"></button>
        <button class="icon-btn" id="btn-more" title="More" aria-label="More actions" aria-haspopup="menu"></button>
      </header>

      <div class="body" id="body">
        <div class="viewer" id="viewer"></div>

        <section class="welcome" id="welcome">
          <div class="welcome-card">
            <div class="welcome-mark" id="welcome-mark"></div>
            <h1>Inkwell</h1>
            <p>Open a PDF and write on it. Your ink is saved beside the file — the PDF itself is never changed.</p>
            <button class="btn-primary" id="btn-open-big">Open PDF…</button>
            <div class="recents" id="recents" hidden></div>
          </div>
        </section>

        <div class="search-bar" id="search-bar" hidden>
          <span class="search-icon" id="search-icon"></span>
          <input
            id="search-input"
            type="text"
            placeholder="Find in document"
            autocomplete="off"
            spellcheck="false"
            aria-label="Find in document"
          />
          <span class="search-count" id="search-count"></span>
          <button class="icon-btn" id="search-prev" title="Previous match  ·  Shift+Enter" aria-label="Previous match"></button>
          <button class="icon-btn" id="search-next" title="Next match  ·  Enter" aria-label="Next match"></button>
          <button class="icon-btn" id="search-close" title="Close  ·  Esc" aria-label="Close search"></button>
        </div>

        <div class="drop-veil" id="drop-veil">Drop a PDF to open it</div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module" src="renderer.js"></script>
  </body>
</html>
