name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  # Electron's setuid sandbox is not available on the runner.
  ELECTRON_DISABLE_SANDBOX: 1

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install system dependencies
        # poppler-utils provides pdftoppm, which the tests use to rasterise
        # exported PDFs; xvfb gives the Electron suites a display.
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils xvfb libnss3 libgbm1 libasound2t64
          python3 -m pip install --quiet --break-system-packages Pillow

      - name: Cache the Electron binary
        # ~100 MB fetched by electron's postinstall. Keyed on the lockfile, so
        # it is refetched only when the pinned version actually changes.
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - run: npm ci

      - name: Ensure the Electron binary is present
        # npm ci does not always run electron's postinstall - CI images are
        # frequently configured with ignore-scripts - which leaves the package
        # installed but the binary missing.
        run: npm run ensure:electron

      - run: npm run build

      - name: Run the test suite
        # A screen larger than the 1280x900 window, so nothing is clipped: the
        # tests address the page in client coordinates.
        run: xvfb-run -a --server-args="-screen 0 1600x1200x24" npm test

  package:
    name: AppImage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache the Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - run: npm ci

      - name: Build AppImage
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: Inkwell-AppImage
          path: release/*.AppImage
          if-no-files-found: error
          retention-days: 14
